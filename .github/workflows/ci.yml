name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android compile SDK baseline
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Unit tests, lint and debug builds
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worktime-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 36
            target: google_apis
          - api-level: "37.1"
            target: playstore_ps16k

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android compile SDK baseline
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: >-
            bash -lc 'set +e;
            package_ready=0;
            for attempt in $(seq 1 60); do
              if adb shell cmd package path android >/dev/null 2>&1; then package_ready=1; break; fi;
              sleep 2;
            done;
            if [ "$package_ready" -ne 1 ]; then
              echo "::error::Android package manager did not become ready";
              exit 1;
            fi;
            ./gradlew connectedDebugAndroidTest --stacktrace 2>&1 | tee connected-android-test.log;
            status=${PIPESTATUS[0]};
            if grep -q "AndroidTestRunner failed" connected-android-test.log; then
              echo "::error::Android test runner failed even though Gradle returned success";
              status=1;
            fi;
            results=$(find app/build -path "*androidTest-results*" -type f -name "*.xml");
            if [ "$status" -eq 0 ] && [ -z "$results" ]; then
              echo "::error::Instrumentation produced no XML test results";
              status=1;
            fi;
            if [ "$status" -eq 0 ] && ! grep -Eh "<testsuite[^>]*tests=\"[1-9][0-9]*\"" $results >/dev/null 2>&1; then
              echo "::error::Instrumentation XML contains no executed tests";
              status=1;
            fi;
            if [ "$status" -ne 0 ]; then
              echo "::group::Instrumentation test XML results";
              find app/build -path "*androidTest-results*" -type f -name "*.xml" -print -exec cat {} \; || true;
              echo "::endgroup::";
            fi;
            exit "$status"'
